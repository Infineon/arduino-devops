name: Release

on:
  release:
    types: published
  push:
    tags: 
      - '[0-9]+.[0-9]+.[0-9]+**'
  workflow_call:
    inputs:
      release-title:
        required: true
        type: string
        description: 'The title of the release'
      setup-script:
        required: false
        type: string
        default: null
        description: 'Any setup script to run before building the release assets'

jobs:
  release:
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout actions
      uses: actions/checkout@v4
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Checkout arduino-devops
      uses: actions/checkout@v4
      with:
        repository: Infineon/arduino-devops
        ref: latest
        path: arduino-devops
    
    - name: Build release changelog
      id: build_changelog
      uses: mikepenz/release-changelog-builder-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Core setup
      if : ${{ inputs.setup-script }} != null
      run: |
        ${{ inputs.setup-script }}

    - name: Build release assets
      run: |
        python arduino-devops/arduino-packager.py

    - name: Upload assets
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ inputs.release-title }} ${{  github.ref_name  }}
        files: |
          build/*.zip
          build/*.json
        body: ${{steps.build_changelog.outputs.changelog}}